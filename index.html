<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGX Theme Patcher</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0d1017;
      --border: #1d2432;
      --text: #c5d1de;
      --muted: #68768a;
      --accent: #5c85b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.2rem; margin: 0 0 14px; }
    .box {
      padding: 14px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      background: var(--panel);
      margin-bottom: 14px;
    }
    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-top: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 12px;
    }
    .status { font-size: 0.85rem; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TGX AMOLED Patcher</h1>
    <div class="box">
      <label>1. Выбери рабочий файл темы (например, Sakura @Moonelx.tgx-theme):</label>
      <input type="file" id="fileInput" accept=".tgx-theme,*/*" />
    </div>
    <div class="box">
      <label>2. Имя новой темы:</label>
      <input type="text" id="themeName" value="Abyssal Slate AMOLED" />
    </div>
    <button id="patchBtn">Перекрасить в AMOLED и скачать</button>
    <div class="status" id="status">Ожидание файла...</div>
  </div>

  <script>
    let rawBuffer = null;

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      rawBuffer = await file.arrayBuffer();
      document.getElementById('status').textContent = `Загружен: ${file.name} (${file.size} байт)`;
    });

    document.getElementById('patchBtn').addEventListener('click', () => {
      if (!rawBuffer) {
        alert('Сначала выбери рабочий .tgx-theme файл!');
        return;
      }

      const decoder = new TextDecoder('utf-8');
      let text = decoder.decode(rawBuffer);
      const newName = document.getElementById('themeName').value.trim() || 'Abyssal AMOLED';

      // Меняем метаданные на темную тему, не трогая структуру и wallpaper
      text = text.replace(/^name:.*$/m, `name: ${newName}`);
      text = text.replace(/^dark:\s*0/m, 'dark: 1');
      text = text.replace(/^lightStatusBar:\s*1/m, 'lightStatusBar: 0');
      text = text.replace(/^replaceShadowsWithSeparators:\s*0/m, 'replaceShadowsWithSeparators: 1');
      text = text.replace(/^shadowDepth:.*$/m, 'shadowDepth: 0.0');

      // Карта замен светлых и розовых цветов из Sakura на AMOLED + серо-синий акцент
      const colorMap = {
        '#FAF7F5': '#000000', // основной фон списков и экранов (filling)
        '#FFFFFF': '#0E131B', // фон входящих пузырей (bubbleIn_background)
        '#ffffff': '#000000', // chatBackground
        '#F8F2F1': '#000000', // шапка (headerBackground)
        '#EFEAE7': '#000000', // background / блоки кода
        '#FBF8F6': '#000000', // клавиатура / непрочитанные
        '#EBCFD6': '#121E2E', // исходящие пузыри (bubbleOut_background)
        '#F3E9EC': '#141B26', // нажатие на входящий
        '#E0BFC8': '#192940', // нажатие на исходящий
        '#EFDDE2': '#121E2E', // позитивная заливка
        '#F6E6EA': '#121E2E',
        '#3A3438': '#C5D1DE', // основной текст (вместо белого, чтоб не резал глаза)
        '#8A8087': '#68768A', // второстепенный текст и иконки
        '#9B9096': '#556275', // время сообщений и плейсхолдеры
        '#7D6F77': '#637994', // время исходящих
        '#B76E86': '#5C85B5', // главный акцент (кнопки, бейджи, активные иконки)
        '#9C4F68': '#5C85B5', // иконки шапки и линии ответов
        '#A25A72': '#749BC7', // ссылки
        '#8A4560': '#85ACE0', // ссылки в исходящих
        '#E3DCD9': '#121721', // разделители
        '#E9E2DF': '#121721',
        '#CFC6C4': '#1A2230', // неактивные элементы / мут
        '#D8CFCD': '#1A2230',
        '#E3B8C4': '#5C85B5'  // переключатели
      };

      // Заменяем цвета построчно, сохраняя прозрачность (альфа-канал, если он есть в конце HEX)
      text = text.replace(/^([a-zA-Z0-9_]+:\s*)(#[0-9a-fA-F]{6})([0-9a-fA-F]{2})?\s*$/gm, (match, prefix, hex, alpha) => {
        const upperHex = hex.toUpperCase();
        // Ищем совпадение без учета регистра
        const foundKey = Object.keys(colorMap).find(k => k.toUpperCase() === upperHex);
        if (foundKey) {
          return `${prefix}${colorMap[foundKey]}${alpha || ''}`;
        }
        return match;
      });

      // Сохраняем строго как UTF-8 без BOM
      const encoder = new TextEncoder();
      const outBytes = encoder.encode(text);
      const blob = new Blob([outBytes], { type: 'application/x-tgx-theme' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = newName.replace(/\s+/g, '_') + '.tgx-theme';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      document.getElementById('status').textContent = 'Готово! Отправь скачанный файл в Избранное в TGX.';
    });
  </script>
</body>
</html>
