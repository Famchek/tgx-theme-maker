<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGX Theme Exporter</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0d1017;
      --border: #1d2432;
      --text: #c5d1de;
      --muted: #68768a;
      --accent: #5c85b5;
      --accent-hover: #6e99cb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 14px;
      font-weight: 600;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 0.95rem;
    }
    textarea {
      width: 100%;
      min-height: 320px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #000000;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TGX Theme Exporter</h1>
    <div class="row">
      <input id="filename" type="text" placeholder="Имя файла (например, Abyssal)" />
      <button class="secondary" type="button" id="detectName">Взять из !name:</button>
      <button class="secondary" type="button" id="clearBtn">Очистить</button>
    </div>
    <textarea id="code" placeholder="Вставь сюда код темы .tgx-theme..."></textarea>
    <div class="actions">
      <button type="button" id="downloadBtn">Скачать .tgx-theme</button>
    </div>
    <div class="swatches" id="swatches"></div>
  </div>

  <script>
    const codeEl = document.getElementById('code');
    const nameEl = document.getElementById('filename');
    const swatchesEl = document.getElementById('swatches');

    function sanitizeName(raw) {
      const cleaned = (raw || 'theme')
        .trim()
        .replace(/\.tgx-theme$/i, '')
        .replace(/[\\/:*?"<>|]+/g, '_')
        .replace(/\s+/g, '_');
      return (cleaned || 'theme') + '.tgx-theme';
    }

    function extractThemeName() {
      const match = codeEl.value.match(/^!name:\s*(.+)$/m);
      if (match && match[1]) {
        nameEl.value = match[1].trim();
      }
    }

    function renderSwatches() {
      const seen = new Set();
      const items = [];
      const lines = codeEl.value.split(/\r?\n/);
      for (const line of lines) {
        const m = line.match(/^\s*([a-z0-9_]+)\s*:\s*(#[0-9a-fA-F]{6,8})\b/);
        if (m && !seen.has(m[2].toUpperCase())) {
          seen.add(m[2].toUpperCase());
          items.push({ key: m[1], hex: m[2].toUpperCase() });
        }
      }
      swatchesEl.innerHTML = items.slice(0, 18).map(item => `
        <div class="swatch" title="${item.key}: ${item.hex}">
          <span class="dot" style="background:${item.hex}"></span>
          <span>${item.hex}</span>
        </div>
      `).join('');
    }

    document.getElementById('detectName').addEventListener('click', extractThemeName);
    document.getElementById('clearBtn').addEventListener('click', () => {
      codeEl.value = '';
      renderSwatches();
    });
    codeEl.addEventListener('input', renderSwatches);

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const content = codeEl.value;
      if (!content.trim()) return;
      const blob = new Blob([content], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = sanitizeName(nameEl.value);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
